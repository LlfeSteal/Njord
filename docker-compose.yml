name: njord

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: njord-backend:latest
    command: ["--addr", ":8080", "--db", "/data/njord.db"]
    environment:
      GIN_MODE: release
      TZ: Europe/Paris
    volumes:
      - njord-data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: njord-frontend:latest
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  njord-data:
