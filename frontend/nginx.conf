# Njord — configuration nginx (image frontend)
# - sert la SPA buildée par Vite (dist/ -> /usr/share/nginx/html)
# - proxifie /api/ vers le backend Go (préfixe /api conservé)

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Imports Excel (plan de charge / réalisé) potentiellement volumineux
    client_max_body_size 50m;
    client_body_timeout  120s;

    # --- Compression -------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- API -> backend ----------------------------------------------------
    # Résolution DNS dynamique via le DNS interne Docker : nginx démarre même
    # si le backend n'est pas encore résolvable et suit ses changements d'IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $njord_backend http://backend:8080;
        # proxy_pass avec variable et sans URI : l'URI d'origine (/api/...)
        # est transmise telle quelle au backend.
        proxy_pass $njord_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Import / recalcul d'analyse : laisser le temps au backend
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        send_timeout          300s;

        # Upload transmis en flux au backend (pas de bufferisation disque)
        proxy_request_buffering off;

        # Les réponses API ne sont jamais mises en cache par le navigateur
        add_header Cache-Control "no-store" always;
    }

    # --- Assets fingerprintés par Vite : cache long -------------------------
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # --- SPA : fallback sur index.html ---------------------------------------
    location / {
        try_files $uri /index.html;
    }

    # index.html ne doit pas être mis en cache (sinon anciens bundles référencés)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
}
